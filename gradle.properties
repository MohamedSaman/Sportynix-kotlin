# Project-wide Gradle settings.
# Keep the Gradle daemon small so it can start on systems with a tight paging file.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=1
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Explicitly configure Gradle to use the system JDK 17 to prevent JLink compile issues
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.4.1
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Disable KSP & Kotlin incremental processing to prevent file locks on Windows
ksp.incremental=false
ksp.incremental.intermodule=false
kotlin.incremental=true
kotlin.incremental.java=false
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:HeapBaseMinAddress=4g -Xss512k -Dfile.encoding=UTF-8

