# Project-wide Gradle settings.
# Use G1GC + compressed class pointers to reduce native memory fragmentation during KSP
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:G1HeapRegionSize=8m -XX:+UseCompressedOops -XX:+UseCompressedClassPointers -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Explicitly configure Gradle to use the system JDK 17 to prevent JLink compile issues
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.4.1
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Disable KSP incremental processing to reduce peak memory usage
ksp.incremental=false
ksp.incremental.intermodule=false
